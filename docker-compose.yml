version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: devlvl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devlvl_enterprise
      POSTGRES_PASSWORD: devlvl_enterprise_pass
      POSTGRES_DB: devlvl_db
    ports:
      - "5433:5432"
    volumes:
      - devlvl_ent_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devlvl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devlvl_ent_redis_data:/data

  adminer:
    image: adminer:latest
    container_name: devlvl_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  devlvl_ent_postgres_data:
  devlvl_ent_redis_data:
